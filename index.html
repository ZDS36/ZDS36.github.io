<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151913" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        let theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        try {
          const saved = localStorage.getItem('between-states-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch { /* Storage may be blocked. */ }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#151913' : '#f5f2e9';
      })();
    </script>
    <meta name="description" content="张刀宋的个人网站——未定态 / Between States。收集网页、工具与影像，也记录把想法变成作品的过程。观看最新动态短片《沉没成本》。" />
    <title>张刀宋｜未定态 / Between States</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111310'/%3E%3Cpath d='M32 10v44M10 32h44M16.4 16.4l31.2 31.2M16.4 47.6l31.2-31.2' stroke='%23d4ef86' stroke-width='3'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/site.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/site.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        if (location.hash || !['/', '/index.html'].includes(location.pathname)) return;

        const root = document.getElementById('root');
        const motion = matchMedia('(prefers-reduced-motion: reduce)');
        const frame = document.createElement('iframe');
        frame.id = 'site-entrance';
        frame.title = '未定态开场';
        frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1000;background:#0c1113;color-scheme:dark';
        root.inert = true;
        root.dataset.entrance = '';

        const ready = new MutationObserver(async () => {
          const home = root.querySelector('.home');
          if (!home || !root.querySelector('.primary-nav')) return;
          ready.disconnect();
          const images = [...home.querySelectorAll('img')].filter(image => image.getBoundingClientRect().top < innerHeight);
          let deadline;
          await Promise.race([
            Promise.allSettled([document.fonts?.ready, ...images.map(image => image.decode?.())]),
            new Promise(resolve => { deadline = setTimeout(resolve, 1600); })
          ]);
          clearTimeout(deadline);
          frame.dataset.ready = '';
          frame.dispatchEvent(new Event('entrance:ready'));
        });
        ready.observe(root, {childList: true, subtree: true});

        function enter(animate) {
          ready.disconnect();
          if (!location.hash) history.replaceState(null, '', '#top');
          const animations = [];
          if (animate && !motion.matches && location.hash === '#top' && typeof root.animate === 'function') {
            const options = {duration: 440, fill: 'backwards', easing: 'cubic-bezier(.21,.74,.27,1)'};
            const assemble = (selector, start) => {
              root.querySelectorAll(selector).forEach((node, index) => {
                animations.push(node.animate([
                  {opacity: 0, translate: '0 12px'},
                  {opacity: 1, translate: '0 0'}
                ], {...options, delay: start + index * 58}));
              });
            };
            assemble('.brand, .primary-nav a, .primary-nav__indicator, .header-actions', 65);
            assemble('.home__intro > *, .home > .featured-work, .home > .home__foot', 390);
          }
          delete root.dataset.entrance;
          root.inert = false;
          frame.remove();
          root.querySelector('main')?.focus({preventScroll: true});
          if (animations.length) {
            const abort = new AbortController();
            const cancel = () => animations.forEach(animation => animation.cancel());
            root.addEventListener('focusin', cancel, {once: true, signal: abort.signal});
            motion.addEventListener('change', cancel, {once: true, signal: abort.signal});
            Promise.allSettled(animations.map(animation => animation.finished)).then(() => abort.abort());
          }
        }

        const entranceDeadline = setTimeout(() => enter(false), 10000);
        frame.addEventListener('load', () => {
          clearTimeout(entranceDeadline);
          if (!frame.contentDocument?.body?.hasAttribute('data-entrance-ready')) enter(false);
        }, {once: true});
        frame.addEventListener('entrance:opening', () => { frame.style.background = 'transparent'; });
        frame.addEventListener('entrance:entered', () => enter(true), {once: true});
        frame.addEventListener('entrance:failed', () => {
          if (root.querySelector('.home')) {
            enter(false);
          } else {
            history.replaceState(null, '', '#top');
            location.reload();
          }
        }, {once: true});
        frame.src = '/entrance.html?handoff=1';
        document.body.append(frame);
      })();
    </script>
    <noscript>此网站需要启用 JavaScript 才能显示 React 页面。</noscript>
  </body>
</html>
